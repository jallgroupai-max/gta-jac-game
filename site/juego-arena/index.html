<style>
  :root { --font: "Archivo", system-ui, "Segoe UI", Arial, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; font-family: var(--font); color: #fff; user-select: none; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #carga { position: fixed; inset: 0; z-index: 20; display: grid; place-content: center; justify-items: center; gap: 14px; background: #f2f2f0; color: #121315; transition: opacity 1.1s ease; }
  #carga.fuera { opacity: 0; pointer-events: none; }
  body.cargando { background: #f2f2f0; }
  body.cargando canvas#c, body.cargando .hud, body.cargando #btnF { visibility: hidden; }   /* mientras carga solo se ve la pantalla blanca: nada del juego asoma por debajo */
  #carga h1 { margin: 0; font-weight: 300; font-stretch: 125%; letter-spacing: .5em; font-size: 44px; padding-left: .5em; }
  #carga p { margin: 0; letter-spacing: .3em; font-size: 12px; color: #7a7d82; }
  #barra { width: 200px; height: 2px; background: rgba(18,19,21,.12); }
  #barra i { display: block; height: 100%; width: 0; background: #121315; transition: width .2s; }

  .hud { position: fixed; z-index: 10; pointer-events: none; }
  #vel { right: 28px; bottom: 24px; text-align: right; text-shadow: 0 2px 14px rgba(0,0,0,.55); }
  #vel b { display: block; font-size: 84px; line-height: .9; font-weight: 600; font-stretch: 112%; font-variant-numeric: tabular-nums; }
  #vel span { font-size: 13px; letter-spacing: .28em; opacity: .8; }
  #marcha { display: inline-block; margin-left: 12px; padding: 2px 10px; border: 1.5px solid rgba(255,255,255,.7); border-radius: 6px; font-weight: 600; letter-spacing: 0; }
  #rpm { margin-top: 10px; width: 260px; height: 5px; margin-left: auto; background: rgba(255,255,255,.22); border-radius: 3px; overflow: hidden; }
  #rpm i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #fff, #ff6b3d); }
  #luces { margin-top: 12px; display: flex; gap: 8px; justify-content: flex-end; }
  #luces em { font-style: normal; font-size: 11px; letter-spacing: .12em; padding: 4px 9px; border-radius: 5px; background: rgba(0,0,0,.4); color: rgba(255,255,255,.45); backdrop-filter: blur(6px); }
  #luces em.on { color: #121315; background: #ffe9a8; }
  #luces em.freno.on { background: #ff5a4a; color: #fff; }

  #mapa { left: 24px; bottom: 24px; width: 200px; height: 200px; border-radius: 50%; border: 3px solid rgba(255,255,255,.85); box-shadow: 0 6px 30px rgba(0,0,0,.5); overflow: hidden; background: #222; }
  #mapa canvas { width: 100%; height: 100%; display: block; }


  #lugar { left: 24px; top: 22px; padding: 8px 16px; border-radius: 20px; background: rgba(10,12,16,.55); backdrop-filter: blur(8px); font-size: 13px; letter-spacing: .06em; }
  #lugar:empty { display: none; }
  #clima { left: 24px; top: 62px; padding: 6px 14px; border-radius: 18px; background: rgba(10,12,16,.5); backdrop-filter: blur(8px); font-size: 12px; letter-spacing: .14em; }
  #hora { left: 24px; top: 100px; padding: 5px 14px; border-radius: 18px; background: rgba(10,12,16,.5); backdrop-filter: blur(8px); font-size: 12px; letter-spacing: .12em; }
  #aviso { left: 50%; top: 22px; transform: translateX(-50%); padding: 8px 18px; border-radius: 20px; background: rgba(10,12,16,.6); backdrop-filter: blur(8px); font-size: 13px; letter-spacing: .08em; opacity: 0; transition: opacity .3s; }
  #aviso.ver { opacity: 1; }
  .ind { left: 0; top: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 14px 9px; border-radius: 16px; background: rgba(10,12,16,.62); backdrop-filter: blur(8px); opacity: 0; visibility: hidden; will-change: transform, opacity; }
  .ind::after { content: ""; position: absolute; left: 50%; top: 100%; width: 16px; height: 7px; margin-left: -8px; background: rgba(10,12,16,.62); clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .ind img { width: 118px; height: auto; display: block; filter: drop-shadow(0 3px 6px rgba(0,0,0,.45)); }
  .ind .tecla { display: flex; align-items: center; gap: 7px; margin-top: 2px; padding: 3px 10px 3px 4px; border-radius: 10px; background: rgba(255,255,255,.12); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; max-height: 0; opacity: 0; overflow: hidden; padding-top: 0; padding-bottom: 0; transition: max-height .2s, opacity .2s, padding .2s; }
  .ind .tecla.on { max-height: 34px; opacity: 1; padding-top: 3px; padding-bottom: 3px; }
  .ind b { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
  @media (max-width: 800px) { .ind { padding: 6px 10px 7px; border-radius: 13px; } .ind img { width: 92px; } .ind b { font-size: 11px; letter-spacing: .1em; } }
  #menu { position: fixed; inset: 0; z-index: 30; display: none; place-content: center; background: rgba(8,10,14,.55); backdrop-filter: blur(6px); }
  #menu.ver { display: grid; }
  #menu .caja { min-width: 340px; max-width: 440px; padding: 26px 30px; border-radius: 14px; background: rgba(18,20,26,.92); box-shadow: 0 10px 40px rgba(0,0,0,.5); text-align: left; }
  #menu h2 { margin: 0 0 16px; font-size: 13px; font-weight: 600; letter-spacing: .28em; opacity: .8; }
  #menu button { display: block; width: 100%; margin: 8px 0; padding: 12px 16px; border: 0; border-radius: 9px; background: rgba(255,255,255,.1); color: #fff; font: 600 13px var(--font); letter-spacing: .12em; text-align: left; cursor: pointer; }
  #menu button:hover, #menu button.act { background: rgba(255,255,255,.9); color: #121315; }
  #menu .fila { display: flex; gap: 8px; } #menu .fila button { margin: 8px 0; text-align: center; padding: 10px 6px; }
  #menu label { display: flex; justify-content: space-between; margin: 14px 0 6px; font-size: 12px; letter-spacing: .1em; } #menu label b { font-weight: 600; }
  #menu input[type=range] { width: 100%; accent-color: #fff; }
  #menu small { display: block; margin-top: 6px; opacity: .6; font-size: 11px; line-height: 1.5; }
  #btnF { position: fixed; z-index: 11; right: 24px; bottom: 230px; padding: 14px 22px; border: 0; border-radius: 28px; background: rgba(255,255,255,.9); color: #121315; font: 600 14px var(--font); letter-spacing: .14em; box-shadow: 0 4px 18px rgba(0,0,0,.4); }
  #btnF[hidden] { display: none; }
  @media (max-width: 800px) { #vel b { font-size: 56px; } #mapa { width: 130px; height: 130px; } }
</style>

<body class="cargando">

<div id="carga"><h1>JAC</h1><p>ARENA PRO · BARQUISIMETO</p><div id="barra"><i></i></div><p id="pct">0 %</p></div>

    <label>Distancia de renderizado <b id="distV">560 m</b></label><input type="range" id="dist" min="150" max="1400" step="10"><small>Hasta dónde se dibuja el mundo (niebla, edificios y detalles). Menos distancia = más fluidez; más distancia = se ve más lejos.</small>
    <label>Hora del juego <b id="horaV">12:00</b></label><input type="range" id="horaS" min="0" max="23.75" step="0.25"><small>Un día dura 20 min a velocidad normal. El cambio se ve al continuar.</small>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { KTX2Loader } from "three/addons/loaders/KTX2Loader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";   // edificios con EXT_meshopt_compression
import { HDRLoader } from "three/addons/loaders/HDRLoader.js";
import { ajustaArena } from "./modelos/ajuste_arena.js";   // ajuste del Arena Pro a su ficha técnica (4,34 x 1,79 x 1,68 m)
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { mergeGeometries, mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
import { SMAAPass } from "three/addons/postprocessing/SMAAPass.js";
import { FXAAPass } from "three/addons/postprocessing/FXAAPass.js";

const CDN = new URL("../juego/vendor/jsm/libs/", import.meta.url).href;
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const touch = matchMedia("(pointer: coarse)").matches;
const HD = !(touch || innerWidth < 900);        // texturas 2K en escritorio, 1K en móvil / pantallas pequeñas

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(20261021);
// ruido de valor y fbm en GLSL, compartido por el cielo, el asfalto y las fachadas
const GLSL_RUIDO = `float hsh(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(hsh(i), hsh(i + vec2(1.0, 0.0)), f.x), mix(hsh(i + vec2(0.0, 1.0)), hsh(i + vec2(1.0, 1.0)), f.x), f.y); }
float fbm(vec2 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 5; i++) { s += a * vn(p); p = p * 2.03 + vec2(17.3, 9.1); a *= 0.5; } return s; }`;
const uWet = { value: 0 };                       // asfalto mojado (de noche): se actualiza en el bucle

// ───────────────────────── render ─────────────────────────

// ───────────────────────── PRECARGA: la pantalla de carga avanza con lo que se va descargando y leyendo (HDR, texturas, carro, conductor, modelos de edificios y su colisión) ─────────────────────────
// Cada tarea tiene un peso (MB aproximados) y un avance 0..1; el % mostrado es la suma ponderada y nunca retrocede. El juego solo se muestra cuando todo está leído, subido a la GPU y compilado.
const SINRENDER = new URLSearchParams(location.search).has("sinrender");   // solo para pruebas automáticas sin GPU: no dibuja, pero la lógica de carga corre igual
const PRE = { t: {}, max: 0, edifOk: false, cuadros: 0, ini: performance.now() };
const preTarea = (n, peso) => { PRE.t[n] = { peso, av: 0 }; };
const preAv = (n, v) => { const t = PRE.t[n]; if (t && v > t.av) t.av = Math.min(1, v); };
const preActualiza = () => { let a = 0, b = 0; for (const k in PRE.t) { a += PRE.t[k].peso * PRE.t[k].av; b += PRE.t[k].peso; } PRE.max = Math.max(PRE.max, b ? a / b : 0); const pc = Math.min(99, Math.floor(PRE.max * 100)); $("barra").firstElementChild.style.width = pc + "%"; $("pct").textContent = pc + " %"; };
const canvas = $("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
// perfiles de calidad: ?calidad=ultra|alta|media|baja (o F4 para rotar; se recuerda). lod = multiplicador de distancias de LOD, tex = tope relativo de resolución de texturas de los modelos, sombra = resolución relativa del mapa de sombras, dpr = resolución máxima (al recargar). No tocan geometría ni colisiones.
const CAL = { ultra: { lod: 1.7, tex: 1, sombra: 1, dpr: 1.5, ao: true }, alta: { lod: 1, tex: 1, sombra: 1, dpr: 1.5, ao: true }, media: { lod: 0.7, tex: 0.5, sombra: 0.75, dpr: 1.25, ao: false }, baja: { lod: 0.45, tex: 0.25, sombra: 0.5, dpr: 1.0, ao: false } };   // ao: oclusión ambiental del coche (la pasada más cara del procesado)
let CALNOM = (() => { try { return new URLSearchParams(location.search).get("calidad") || localStorage.getItem("jacCalidad") || "alta"; } catch (e) { return "alta"; } })(); if (!CAL[CALNOM]) CALNOM = "alta";
let CALIDAD = CAL[CALNOM];
const DIST_BASE = 560;                              // m de visibilidad (niebla) de día con DIST = 1
let DIST = (() => { try { const v = parseFloat(localStorage.getItem("jacDist")); return v > 0 ? Math.min(2.5, Math.max(150 / DIST_BASE, v)) : 1; } catch (e) { return 1; } })();   // multiplicador de la distancia de renderizado (menú Esc > Opciones)
const DPR = Math.min(devicePixelRatio, touch ? 1.0 : CALIDAD.dpr);       // resolución moderada: es lo que más pesa en memoria y GPU
renderer.info.autoReset = false;                 // el compositor hace varios render() por cuadro: se reinicia a mano al inicio de cada uno
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;      // en r183 PCFSoftShadowMap está obsoleto y equivale a esta (filtrado PCF suave)
renderer.toneMapping = THREE.NeutralToneMapping;     // Khronos PBR Neutral: conserva el blanco perla sin quemarlo ni aplanarlo (lo aplica OutputPass)
renderer.toneMappingExposure = 1.0;
const kt = new KTX2Loader().setTranscoderPath(CDN + "basis/").detectSupport(renderer);   // texturas KTX2 (Basis) de los vehículos
const ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.5, 1100);
const pmrem = new THREE.PMREMGenerator(renderer);
const envProv = pmrem.fromScene(new RoomEnvironment(), 0.04);
scene.environment = envProv.texture;             // provisional hasta que cargue el HDR
preTarea("entorno", 6);
new HDRLoader().load("./entorno/wide_street_01_1k.hdr", (t) => {
  t.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = pmrem.fromEquirectangular(t).texture; t.dispose(); envProv.dispose(); pmrem.dispose();   // libera el entorno provisional y los shaders del PMREM
  preAv("entorno", 1);
}, (ev) => { if (ev.total) preAv("entorno", ev.loaded / ev.total * 0.95); }, () => preAv("entorno", 1));

const hemi = new THREE.HemisphereLight(0xcfe6ff, 0x4a4a40, 0.9);
const sol = new THREE.DirectionalLight(0xfff4e0, 3);
const SOMBRA = 40;                               // lado en metros de la zona con sombra, alrededor del coche (sin edificios solo importa lo cercano)
const SOMBRA_RES = touch ? 1024 : 2048;
sol.castShadow = true;
sol.shadow.mapSize.set(SOMBRA_RES, SOMBRA_RES);
Object.assign(sol.shadow.camera, { left: -SOMBRA / 2, right: SOMBRA / 2, top: SOMBRA / 2, bottom: -SOMBRA / 2, near: 1, far: 140 });
sol.shadow.bias = -0.0002; sol.shadow.normalBias = 0.06;       // texel de ~2 cm (escritorio) / ~4 cm (táctil)
scene.add(hemi, sol, sol.target);
scene.fog = new THREE.Fog(0xb9d3e8, 70, 560);

// antialiasing por MSAA en el render target del compositor (sin él, ventanas y rayas parpadean al moverse)
const rt = new THREE.WebGLRenderTarget(innerWidth * DPR, innerHeight * DPR, { type: THREE.HalfFloatType, samples: touch ? 0 : 2 });
const composer = new EffectComposer(renderer, rt);
composer.setPixelRatio(DPR); composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
// AO solo en escritorio y solo del coche (capa 1): oscurece pasos de rueda, bajos y uniones sin renderizar toda la ciudad una segunda vez
let gtao = null;
if (!touch) {
  gtao = new GTAOPass(scene, camera, innerWidth * DPR, innerHeight * DPR, undefined, { radius: 0.9, distanceExponent: 1, thickness: 1, scale: 1.5, samples: 16, distanceFallOff: 1 });
  gtao.blendIntensity = 1;
  const r = gtao.render.bind(gtao);
  gtao.render = (...a) => {                        // el pase de normales/profundidad ve solo la capa 1 y no repite el mapa de sombras
    camera.layers.set(1); renderer.shadowMap.autoUpdate = false;
    r(...a);
    camera.layers.set(0); renderer.shadowMap.autoUpdate = true;
  };
  composer.addPass(gtao);
}
// Saneado: algunos reflejos del modelo producen píxeles NaN/infinitos en el buffer HDR; el bloom los esparcía por toda la
// pantalla (parpadeo al moverse, vista interior en negro). Se sustituyen por el promedio de los vecinos válidos.
const limpia = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, px: { value: new THREE.Vector2() } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 px; varying vec2 vUv;
    const vec2 O[8] = vec2[8](vec2(-1.,0.), vec2(1.,0.), vec2(0.,-1.), vec2(0.,1.), vec2(-2.,0.), vec2(2.,0.), vec2(0.,-2.), vec2(0.,2.));
    bool mal(vec4 c){ return any(isnan(c)) || any(isinf(c)); }
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      if (mal(c)) { vec4 a = vec4(0.); float n = 0.; for (int i = 0; i < 8; i++) { vec4 t = texture2D(tDiffuse, vUv + O[i] * px); if (!mal(t)) { a += t; n += 1.; } } c = n > 0. ? a / n : vec4(0.); }
      gl_FragColor = vec4(min(c.rgb, vec3(5.0)), 1.0);
    }`,
});
const gradePx = new THREE.Vector2(1 / 1280, 1 / 720);       // tamaño de píxel para la nitidez de la gradación (se comparte con el uniform)
let dprAct = DPR;                                // resolución dinámica: DPR es el máximo; baja solo si el equipo no sostiene ~45 fps (ver ajustaDPR)
const ajustaPx = () => { limpia.uniforms.px.value.set(1 / (innerWidth * dprAct), 1 / (innerHeight * dprAct)); gradePx.copy(limpia.uniforms.px.value); };
ajustaPx(); composer.addPass(limpia);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.4, 0.5, 1.2);
composer.addPass(bloom);
composer.addPass(new OutputPass());
// gradación final (sobre la imagen ya con tone mapping): aberración cromática radial mínima, curva en S y saturación, sombras frías / luces cálidas, viñeta y grano de película
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uNoche: { value: 0 }, uT: { value: 0 }, uGris: { value: 0 }, uPx: { value: gradePx } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uNoche, uT, uGris; uniform vec2 uPx; varying vec2 vUv;
    void main(){
      vec2 d = vUv - 0.5; float r2 = dot(d, d); vec2 o = d * r2 * 0.005;
      vec3 c = vec3(texture2D(tDiffuse, vUv + o).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - o).b);
      vec3 bl = (texture2D(tDiffuse, vUv + vec2(uPx.x, 0.0)).rgb + texture2D(tDiffuse, vUv - vec2(uPx.x, 0.0)).rgb + texture2D(tDiffuse, vUv + vec2(0.0, uPx.y)).rgb + texture2D(tDiffuse, vUv - vec2(0.0, uPx.y)).rgb) * 0.25;
      c += clamp((c - bl) * 0.38, -0.08, 0.08);          // nitidez (máscara de enfoque con límite: realza detalle fino sin halos)
      c = clamp(c, 0.0, 1.0); float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c = mix(vec3(l), c, 1.07 + 0.08 * uNoche - 0.22 * uGris);
      c = mix(c, c * c * (3.0 - 2.0 * c), 0.35);
